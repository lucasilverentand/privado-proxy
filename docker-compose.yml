services:
  privado:
    build: .
    container_name: privado-proxy
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    environment:
      - PRIVADO_USERNAME=${PRIVADO_USERNAME}
      - PRIVADO_PASSWORD=${PRIVADO_PASSWORD}
      - PRIVADO_SERVER=${PRIVADO_SERVER:-}
      - SOCK_PORT=1080
      - DASHBOARD_ENABLED=${DASHBOARD_ENABLED:-false}
      - DASHBOARD_PORT=${DASHBOARD_PORT:-8080}
    ports:
      - "1080:1080"
      # Enable this together with DASHBOARD_ENABLED=true.
      # - "8080:8080"
